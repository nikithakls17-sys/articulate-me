services:
  - type: web
    name: i-talk-you-listen
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: MODE
        value: hosted
      - key: LLM_PROVIDER
        value: digitalocean
      - key: STT_PROVIDER
        value: elevenlabs
      - key: DO_MODEL
        sync: false
      - key: DO_MODEL_ACCESS_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: PROMPT_VERSION
        value: v1
      - key: MAX_RECORDING_SEC
        value: "90"
      - key: MAX_ATTEMPTS_PER_DAY
        value: "30"
      - key: MAX_CONCURRENT_SESSIONS
        value: "4"
